[project]
name = "prism"
version = "0.1.0"
description = "PRISM: simulation-based model selection and parameter inference."
readme = "README.md"
authors = [
  { name = "Manuel Gloeckler", email = "manuel.gloeckler@uni-tuebingen.de" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "diffusion MRI",
    "JAX",
    "model selection",
    "simulation-based inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "hydra-optuna-sweeper>=1.2",
    "jupyter>=1.1",
    "wandb>=0.23",
    "matplotlib>=3.7.0",
    "rich>=13.7",
    "dipy>=1.7.0",
    "nibabel>=5.1.0",
    "pandas>=2.0.0",
    "probjax @ git+https://github.com/mackelab/probjax.git@v0.1.1",
    "orbax-checkpoint>=0.11",
    "plotly>=6.4",
    "prompt-toolkit>=3.0",
    "optax>=0.2",
    "flax==0.12.0",
    "sympy>=1.11",
    # Submitit imports pkg_resources, which was removed in setuptools 81.
    "setuptools>=80.9,<81",
    "absl-py>=2.3",
    "huggingface-hub>=0.34",
    "safetensors>=0.4",
    # probjax pins Flax 0.12.0; newer JAX removes its jit abstracted_axes argument.
    "jax==0.8.1"
]

[project.urls]
Homepage = "https://github.com/mackelab/prism"
Documentation = "https://github.com/mackelab/prism/tree/main/docs"
Repository = "https://github.com/mackelab/prism"
Issues = "https://github.com/mackelab/prism/issues"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.8.1"]
cuda13 = ["jax[cuda13]==0.8.1"]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.1,<2.0.0",
    "pre-commit>=3.3.3,<4.0.0"
]
docs = [
    "zensical>=0.0.51,<0.1",
    "mkdocstrings-python>=1.10.0",
    "nbconvert>=7.16.0",
    # Notebooks are executed during the docs build, which needs a live kernel.
    "ipykernel>=6.29.0",
]


[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "B", "I", "W", "C4", "N", "UP"]
lint.ignore = ["E501", "N806", "C408", "N803","N802"]
target-version = "py311"
fix = true

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ruff.lint.isort]
known-first-party = ["prism"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["prism*", "conf*"]

[tool.setuptools.package-data]
"conf" = ["**/*.yaml"]
"prism.dmri.simulators" = ["data/*"]
"prism.symbolic.paper" = ["data/*.npy"]
