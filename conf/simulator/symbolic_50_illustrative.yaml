# K=50 simulator observed at ten inputs (x = 0, 1, ..., 9), as in Figures 2, 4a.
# Differs from symbolic_50 only by x_step and input_dim.
model_class: prism.symbolic.paper.model_specs.SymbolicModelV50
posterior_score: false
observation_format: signal_blocks
x_min: 0.0
x_max: 10.0
x_step: 1.0
input_dim: 1
mask_prior:
  alpha: 1.0
  beta: 1.0
  min_active_models: 1
