name: StaticDataset

dataset:
  dataset_size: 10000
  # Matches the frozen implementation's generation batch (validation: 1024).
  simulation_batch_size: 10000
  return_numpy: false
  device:
    kind: cpu
    index: 0

train_loader:
  batch_size: 128
  shuffle: true
  drop_last: true
  loop: true
  num_prefetch_host: 8
  num_prefetch_device: 8
  num_async_workers: 1

val_dataset:
  dataset_size: 1024
  # The original validation set is generated by a single vmap.
  simulation_batch_size: null

val_loader:
  batch_size: 128
  shuffle: false
  drop_last: false
  loop: true
  num_prefetch_host: 4
  num_prefetch_device: 2
