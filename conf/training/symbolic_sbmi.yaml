inner_steps: 500
checkpoint_freq: 2000
eval_freq: 2000
# As in the original runs, the terminal checkpoint is saved without a final validation.
eval_at_end: false
continue_training: false
partial_restore: false
checkpoint:
  max_checkpoints: 3
max_train_hours: 72
max_train_steps: null
model_selection_weight: 1.0
model_selection_warmup_steps: 15000
model_selection_ramp_steps: 15000
model_inference_loss_weight: 1.0
weight_by_complexity: false
track_ema: true
ema_decay: 0.999
cut_off_tsm: 0.1
label_smoothing: 0.0
use_loss_mask: true
restart_optimizer: false
recovery_threshold: 5.0
permute_order: false

eval:
  nnl_theta:
    iters: 5
  nnl_mask:
    iters: 5
  # The original symbolic training loop did not execute KSD.
  ksd:
    iters: 0

defaults:
  - optimizer: radam
  - dataloader: symbolic_sbmi
