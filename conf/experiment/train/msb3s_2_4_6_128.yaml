# @package _global_

simulator:
  posterior_score: true

defaults:
- _self_
- override /simulator: multishell_ball3stick_shared
- override /simulator/acquisition: multi
- override /model: dmri
- override /infrastructure/launcher: slurm
- override /infrastructure/partition: h100_long
run:
  name: msb3s_2_4_6_128

model:
  model_dim: 128
  embedding_net:
    params:
      num_layers: 2
  model_selection_net:
    params:
      num_layers: 4
  inference_net:
    params:
      num_layers: 6

training:
  max_train_hours: 70
