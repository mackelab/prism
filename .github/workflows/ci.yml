name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.13
        uv sync --locked --extra dev --python "${{ matrix.python-version }}"

    - name: Run tests
      run: |
        .venv/bin/python -m pytest tests/ --cov=prism --cov-report=xml

    - name: Run training and inference example
      run: .venv/bin/python examples/smoke_polynomial.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.14'

    - name: Install dependencies
      run: |
        python -m pip install uv==0.12.13
        uv sync --locked --extra dev --python 3.12.14

    - name: Check formatting with Ruff
      run: |
        .venv/bin/ruff format --check prism tests examples experiments

    - name: Lint with Ruff
      run: |
        .venv/bin/ruff check prism tests examples experiments
